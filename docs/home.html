<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Happy Birthday Surprise</title>
    <meta name="description" content="A playful birthday surprise full of little reveals and wishes." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23131b3a'/%3E%3Cpath d='M18 30h28v22H18z' fill='%23ffcf66'/%3E%3Cpath d='M14 24h36v10H14z' fill='%23ff6f91'/%3E%3Cpath d='M32 24v28' stroke='%23131b3a' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./home.css" />
    <script src="./home.js" defer></script>
  </head>
  <body>
    <main class="app" aria-live="polite">
      <section class="stage intro active">
        <div class="spark-field" aria-hidden="true"></div>
        <div class="birthday-shell">
          <h1 class="birthday-title">Happy Birthday</h1>
          <div class="intro-card">
            <p class="eyebrow">One little check first</p>
            <h2>Okay cer tulis apa nama awak saya save dalam phone saya</h2>
            <form class="hello-form" autocomplete="off">
              <label for="nameInput">Nama awak</label>
              <div class="input-row">
                <input id="nameInput" name="name" type="text" inputmode="text" placeholder="Tulis nama awak" aria-describedby="introHint" />
                <button type="submit">Check</button>
              </div>
              <p id="introHint" class="hint" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
