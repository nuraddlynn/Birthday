<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pilih Mana Duluu | Birthday Surprise</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23131b3a'/%3E%3Cpath d='M18 30h28v22H18z' fill='%23ffcf66'/%3E%3Cpath d='M14 24h36v10H14z' fill='%23ff6f91'/%3E%3Cpath d='M32 24v28' stroke='%23131b3a' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./wish.css?v=11" />
    <script src="./wish.js?v=6" defer></script>
  </head>
  <body>
    <main class="app" aria-live="polite">
      <section class="stage wish-stage active">
        <div class="scene-copy">
          <h1>Pilih nak tengok mana duluu</h1>
          <p>Buka tiga yang lain baru boleh unlock lagi satu tuu</p>
        </div>
        <div class="wish-grid" aria-label="Love surprise boxes">
          <button class="love-box" type="button" data-love data-image="./assets/childhood-photo.jpeg" data-image-alt="Gambar masa kecil" data-caption="nyomeyynyeee sayang masa kecikkk" aria-label="Buka love pertama">
            <span class="box-icon" aria-hidden="true">&#10084;&#65039;</span>
          </button>
          <button class="love-box" type="button" data-love data-image="./assets/first-photobooth.jpeg" data-image-alt="Gambar first photobooth kita" data-caption="gambar first photobooth kita hehee" aria-label="Buka love kedua">
            <span class="box-icon" aria-hidden="true">&#10084;&#65039;</span>
          </button>
          <button class="love-box" type="button" data-love data-image="./assets/first-standing-together.jpeg" data-image-alt="Gambar first kita berdiri sebelah each other" data-caption="ni gambar first kita berdiri sebelah each other pastu depan orang ramaii skksfinwief kelakar" aria-label="Buka love ketiga">
            <span class="box-icon" aria-hidden="true">&#10084;&#65039;</span>
          </button>
          <button class="final-box" type="button" disabled aria-label="Box terakhir masih locked">
            <span class="box-icon" data-final-icon aria-hidden="true">&#128274;</span>
          </button>
        </div>
        <button class="come-here-button" type="button" hidden>meh sinii</button>
      </section>
    </main>

    <dialog class="photo-dialog" aria-labelledby="photoCaption">
      <img class="memory-photo" alt="" />
      <p id="photoCaption"></p>
      <button class="photo-continue" type="button">Sambung</button>
    </dialog>

    <dialog class="video-dialog" aria-labelledby="videoCaption">
      <video class="memory-video" controls playsinline preload="metadata">
        <source src="./assets/favorite-video.mp4" type="video/mp4" />
      </video>
      <p id="videoCaption">saja je lock video ni, takde apa sangat pun, just video awak yang saya sukaaa, nyomeyy sangat awak dalam ni</p>
      <button class="video-continue" type="button">Sambung</button>
    </dialog>
  </body>
</html>
